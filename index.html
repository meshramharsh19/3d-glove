<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay" style="display: none">
    <div class="spinner"></div>
    <p id="loading-text">Processing model...</p>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div id="memory-warning">
      <strong>Warning:</strong> Loading large models may cause performance issues.
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <h2>🗺 Model & Layer Controls</h2>

    <!-- Search -->
    <div class="input-group" id="search-container">
      <label for="searchInput">🔍 Search Property</label>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="e.g., H101, Owner Name, Phone..."
          oninput="debounce(searchProperties, 300)()" onfocus="searchProperties()" autocomplete="off" />

        <button class="search-btn" onclick="searchProperties()">Search</button>
      </div>

      <div id="search-results"></div>
    </div>

    <!-- KMZ Layers -->
    <div class="input-group layer-control">
      <label>🗂 KMZ Layers</label>

      <div class="layer-toggle" onclick="toggleLayer('model')">
        <input type="checkbox" id="modelToggle" checked onclick="event.stopPropagation(); toggleLayer('model')" />
        <label for="modelToggle">3D Model</label>
        <span class="layer-status status-loaded" id="modelStatus">Loaded</span>
      </div>

      <div style="padding-left: 30px; margin-bottom: 10px">
        <label style="font-size: 11px; color: #95a5a6">Model Opacity</label>
        <input type="range" id="modelOpacity" min="0" max="100" value="100" class="opacity-slider"
          oninput="updateModelOpacity(this.value)" />
        <div class="slider-label">
          <span>Transparent</span>
          <span id="modelOpacityValue">100%</span>
          <span>Opaque</span>
        </div>
      </div>

      <div class="layer-toggle-row">
        <div class="layer-toggle" onclick="toggleLayer('roads')">
          <input type="checkbox" id="roadsToggle" onclick="event.stopPropagation(); toggleLayer('roads')" />
          <label for="roadsToggle">Roads</label>
          <span class="layer-status status-loading" id="roadsStatus">Loading...</span>
        </div>

        <div class="layer-toggle" onclick="toggleLayer('houses')">
          <input type="checkbox" id="housesToggle" onclick="event.stopPropagation(); toggleLayer('houses')" />
          <label for="housesToggle">Houses</label>
          <span class="layer-status status-loaded" id="housesStatus">Loaded</span>
        </div>
      </div>

    </div>

   <div class="input-group position-grid">

  <div class="row2">
    <label>Longitude:</label>
    <input type="number" id="longitude" />

    <label>Latitude:</label>
    <input type="number" id="latitude" />
  </div>

  <div class="row1">

    <input type="number" id="height" />

    <!-- <--SCALES -->
    <div class="input-group six-grid">

      <label class="six-title">SCALES</label>

      <div class="pair">
        <label>Longitude:</label>
        <input type="number" id="longitude" />
      </div>

      <div class="pair">
        <label>Latitude:</label>
        <input type="number" id="latitude" />
      </div>

      <div class="pair">
        <label>Height:</label>
        <input type="number" id="height" />
      </div>

      <div class="pair">
        <label>Heading:</label>
        <input type="number" id="heading" />
      </div>

      <div class="pair">
        <label>Pitch:</label>
        <input type="number" id="pitch" />
      </div>

      <div class="pair">
        <label>Roll:</label>
        <input type="number" id="roll" />
      </div>

    </div>




    <!-- Scale -->
    <div class="input-group">
      <!-- Buttons -->
      <div class="action-row">
        <button class="action-btn" onclick="resetToGroundLevel()">Ground</button>
        <button class="action-btn" onclick="centerOnModel()">Center</button>
        <button class="action-btn" onclick="optimizeMemory()">Free</button>
      </div>

    </div>

    <input type="number" id="scale" value="50.1" step="0.1" min="0.1" max="100" />
  <div><button id="downloadPtaxPdfBtn" class="ptax-pdf-btn">
    📄 Download Property PDF
  </button></div>
  </div>



  <!-- Cesium Map -->
  <div id="map-wrapper">
    <div id="map-card">
      <div id="cesiumContainer"></div>
    </div>
  </div>


  <!-- Road Popup -->
  <div id="roadPopup" class="road-popup hidden">
    <div class="road-popup-header">
      <span class="popup-title">Road Survey</span>
      <div class="popup-actions">
        <button id="resizeBtn">⛶</button>
        <button id="closeBtn">✕</button>
      </div>
    </div>
    <div class="popup-body">
      <iframe id="roadIframe" allow="autoplay; fullscreen; microphone" allowfullscreen></iframe>
    </div>
  </div>

  <script src="ptax_data.js"></script>

  <script src="js/7_main.js"></script>
  <button id="themeToggle" class="theme-toggle-btn" title="Toggle theme">
    🌙
  </button>


  <script>
    const toggleBtn = document.getElementById("themeToggle");
    const body = document.body;

    if (localStorage.getItem("theme") === "light") {
      body.classList.add("light-theme");
      toggleBtn.textContent = "🌞";
    }

    toggleBtn.addEventListener("click", () => {
      body.classList.toggle("light-theme");

      const isLight = body.classList.contains("light-theme");
      toggleBtn.textContent = isLight ? "🌞" : "🌙";
      localStorage.setItem("theme", isLight ? "light" : "dark");
    });
  </script>
